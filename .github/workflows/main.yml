name: Build and Push Frontend to GHCR

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: develop

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env.development
        run: |
          cat <<EOF > .env.development
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          EOF

      # 3. Log in to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Set image name
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/rent-apart-frontend:latest" >> $GITHUB_ENV

      # 5. Build Docker image
      - name: Build image
        run: docker build -t $IMAGE .

      # 6. Push Docker image
      - name: Push image
        run: docker push $IMAGE

      # 7. Trigger infra deploy
      - name: Trigger infra deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_PAT }}" \
            https://api.github.com/repos/Dallss/rentapart-infra/dispatches \
            -d '{"event_type":"deploy"}'
