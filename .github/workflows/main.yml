name: Build and Push Frontend to GHCR

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log in to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set image name
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/rent-apart-frontend:latest" >> $GITHUB_ENV

      # 4. Build Docker image
      - name: Build image
        run: docker build -t $IMAGE .

      # 5. Push Docker image
      - name: Push image
        run: docker push $IMAGE
